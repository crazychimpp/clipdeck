<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clipdeck Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffd23f'/%3E%3Ctext x='16' y='23' font-family='Impact,sans-serif' font-size='17' text-anchor='middle' fill='%23111'%3E%231%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bangers&family=Bebas+Neue&family=Luckiest+Guy&family=Montserrat:wght@900&family=Oswald:wght@700&family=Permanent+Marker&display=swap">
<style>
/* Layout: a dark editing suite for ranking Shorts. Left rail for navigation, a dashboard of rankings, and a three-zone editor (library | 9:16 monitor | inspector) over a full-width rank timeline. */
:root{
  --bg:#111318; --panel:#181b22; --raise:#20242d; --line:#2c313c; --line-2:#3a404d;
  --fg:#eceef3; --mute:#9aa1b0; --faint:#6c7383;
  --accent:#4d7cff; --accent-ink:#ffffff; --accent-soft:rgba(77,124,255,.16);
  --hot:#ffd23f; --danger:#ff5d5d; --ok:#3ecf8e;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-rank:"Anton","Impact",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
a.btn{text-decoration:none;color:inherit}
code{font-family:var(--f-mono);font-size:12px;background:var(--bg);padding:1px 5px;border-radius:4px;word-break:break-all}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:76px 1fr;height:100%}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:14px;padding-left:env(safe-area-inset-left,0px)}
.logo{width:40px;height:40px;border-radius:10px;background:var(--hot);display:grid;place-items:center;font-family:var(--f-rank);font-size:19px;color:#111;margin-bottom:14px}
.navbtn{width:60px;padding:8px 0;border:0;border-radius:10px;background:transparent;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600}
.navbtn svg{width:22px;height:22px}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.navbtn:hover{color:var(--fg)}
.navbtn:disabled{opacity:.35;cursor:default}
main{min-width:0;overflow:auto}
.view{padding-block:28px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.dash{max-width:1180px;margin:0 auto;display:grid;gap:32px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--hot);font-weight:800}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
h2{font-size:20px;font-weight:800}
h3{font-size:14px;font-weight:700;font-family:var(--f-body)}
.lede{color:var(--mute);max-width:62ch;margin:0}
.compose{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:16px}
.compose-row{display:grid;grid-template-columns:1fr 110px 190px auto;gap:10px;align-items:end}
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--mute);font-weight:600}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
.btn{border:1px solid var(--line-2);background:var(--raise);border-radius:8px;padding:10px 14px;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.ideas{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:10px}
.ideas-row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.ideas-row .field{flex:1;min-width:200px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13px;text-align:left}
.chip b{font-family:var(--f-rank);font-weight:400;color:var(--hot);margin-right:6px;letter-spacing:.02em}
.chip:hover{border-color:var(--hot)}
.note{font-size:12px;color:var(--faint)}
.status{font-size:13px;color:var(--mute);min-height:1.4em}
.status.err{color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.card:hover{border-color:var(--line-2)}
.thumb{aspect-ratio:9/12;background:var(--raise);position:relative;overflow:hidden;max-width:100%}
.thumb canvas{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.card-body{padding:12px 14px;display:grid;gap:4px}
.card-meta{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.tag{position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.6);padding:3px 7px;border-radius:5px}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
.editor{display:grid;grid-template-rows:auto 1fr auto;height:100%;min-height:640px}
.ed-top{display:flex;gap:10px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.ed-top input.name{background:transparent;border:1px solid transparent;font-family:var(--f-display);font-weight:800;font-size:17px;padding:6px 8px;width:auto;flex:1;min-width:140px}
.ed-top input.name:hover,.ed-top input.name:focus{border-color:var(--line-2)}
.ed-main{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;min-height:0}
.pane{border-right:1px solid var(--line);overflow:auto;padding:16px;display:grid;gap:18px;align-content:start;min-width:0}
.pane:last-child{border-right:0;border-left:1px solid var(--line)}
.tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:8px}
.tabs button{flex:1;border:0;background:transparent;padding:7px 4px;border-radius:6px;font-size:12px;font-weight:600;color:var(--mute)}
.tabs button[aria-selected="true"]{background:var(--raise);color:var(--fg)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{border:1px solid var(--line-2);background:var(--bg);border-radius:8px;padding:10px 6px;font-size:12px;font-weight:700;display:grid;gap:6px;justify-items:center}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.seg svg{width:44px;height:60px}
.drop{border:1.5px dashed var(--line-2);border-radius:10px;padding:18px;text-align:center;color:var(--mute);font-size:13px;display:grid;gap:8px;justify-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lib-item{position:relative;background:var(--raise);border-radius:8px;overflow:hidden;aspect-ratio:1;border:1px solid var(--line);padding:0}
.lib-item img,.lib-item video{width:100%;height:100%;object-fit:cover;display:block}
.lib-item .cap{position:absolute;left:0;right:0;bottom:0;font-size:10px;padding:3px 6px;background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.lib-item .kind{position:absolute;top:4px;right:4px;font-size:9px;font-weight:700;background:rgba(0,0,0,.65);padding:2px 5px;border-radius:4px;text-transform:uppercase}
.lib-item .audio-ico{display:grid;place-items:center;height:100%;color:var(--mute)}
.stage{display:grid;grid-template-rows:1fr auto;min-height:0;background:#0b0c10;min-width:0}
.monitor{display:grid;place-items:center;padding:18px;min-height:0;overflow:hidden}
.monitor canvas{height:100%;max-height:min(70vh,760px);max-width:100%;aspect-ratio:9/16;border-radius:10px;background:#000;box-shadow:0 0 0 1px var(--line)}
.stage.src{grid-template-rows:minmax(0,1fr)}.stage.src .monitor,.stage.src .transport{display:none}
.srcview{overflow:auto;padding:16px 18px;min-height:0}
.cutter-inline{display:grid;gap:12px;max-width:760px;margin:0 auto}
.cutter-inline{gap:10px}.cutter-inline .cut-stage video{max-height:min(36vh,460px)}
.src-empty{max-width:520px;margin:12vh auto 0;display:grid;gap:12px;text-align:center;justify-items:center}
.src-empty .jobwrap{justify-content:center}
.link-row{cursor:pointer}
.transport{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.tc{font-family:var(--f-mono);font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;min-width:110px;text-align:center}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:var(--raise);display:grid;place-items:center;padding:0}
.iconbtn.big{width:46px;height:46px;background:var(--accent);border-color:var(--accent);color:#fff}
.iconbtn svg{width:18px;height:18px}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > .field{flex:1}
.sect{display:grid;gap:10px}
.sect-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rankpill{font-family:var(--f-rank);font-size:28px;color:#111;background:var(--hot);border-radius:8px;padding:0 12px;line-height:1.3}
.kindpill{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--raise);border:1px solid var(--line-2);border-radius:6px;padding:4px 8px;color:var(--mute)}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.style-opt{border:1px solid var(--line-2);background:var(--bg);border-radius:8px;padding:10px 4px;font-size:11px;font-weight:700;display:grid;gap:4px;justify-items:center}
.style-opt span.s{font-family:var(--f-rank);font-size:16px;letter-spacing:.02em}
.style-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:6px;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.timeline{border-top:1px solid var(--line);background:var(--panel);padding:10px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px}
.tl-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tl-scroll{overflow-x:auto;padding-bottom:4px}
.tl-track{position:relative;display:flex;gap:4px;min-width:100%;height:84px;padding-top:16px}
.ruler{position:absolute;top:0;left:0;right:0;height:14px;font-family:var(--f-mono);font-size:9px;color:var(--faint);cursor:pointer}
.ruler span{position:absolute;top:0;transform:translateX(-50%)}
.clip{position:relative;height:68px;border-radius:7px;border:1.5px solid transparent;overflow:hidden;flex:none;padding:6px 8px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:var(--raise)}
.clip[aria-selected="true"]{border-color:var(--hot)}
.clip .rk{font-family:var(--f-rank);font-size:20px;line-height:1;color:var(--hot);text-shadow:0 1px 3px #000;position:relative}
.clip .kd{font-size:10px;font-weight:800;letter-spacing:.1em;position:relative;text-shadow:0 1px 2px #000}
.clip .ct{font-size:11px;font-weight:700;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.7);position:relative}
.clip .cd{font-family:var(--f-mono);font-size:10px;opacity:.85;position:absolute;right:6px;top:6px}
.clip .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
.clip.dragging{opacity:.4}
.clip.drop-on{border-color:var(--accent)}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--hot);pointer-events:none;z-index:3}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--hot)}
.music-lane{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);min-height:24px}
.music-bar{height:18px;border-radius:5px;background:repeating-linear-gradient(90deg,rgba(62,207,142,.35) 0 2px,transparent 2px 5px);flex:1;border:1px solid rgba(62,207,142,.4)}
.modal{position:fixed;inset:0;background:rgba(5,6,10,.72);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-box{background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:22px;width:min(440px,100%);display:grid;gap:14px;max-height:100%;overflow:auto}
.modal-box video{width:100%;max-height:50vh;border-radius:8px;background:#000}
.modal-box.wide{width:min(660px,100%)}
.cut-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cut-stage{background:#000;border-radius:10px;display:grid;place-items:center;overflow:hidden}
.cut-stage video{width:auto;max-width:100%;max-height:40vh;display:block;border-radius:0}
.cut-bar{position:relative;height:58px;margin:4px 9px 0;border-radius:8px;background:var(--bg);touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.strip{position:absolute;inset:0;display:flex;border-radius:8px;overflow:hidden;opacity:.5}
.strip canvas{flex:1;min-width:0;width:0;height:100%;display:block}
.win{position:absolute;top:-3px;bottom:-3px;min-width:12px;border:3px solid var(--hot);border-radius:6px;background:rgba(255,210,63,.16);cursor:grab}
.win:active{cursor:grabbing}
.hdl{position:absolute;top:50%;width:14px;height:36px;background:var(--hot);border-radius:4px;transform:translateY(-50%);cursor:ew-resize;display:grid;place-items:center}
.hdl::after{content:"";width:2px;height:14px;background:#111;border-radius:1px}
.hdl.l{left:-10px}.hdl.r{right:-10px}
.cph{position:absolute;top:-7px;bottom:-7px;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 3px #000;pointer-events:none}
.cut-zoom{gap:6px}.cut-zoom [aria-pressed="true"]{border-color:var(--hot);color:var(--hot)}
.cut-stage video::-webkit-media-controls-fullscreen-button{display:none}
.cut-ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--faint);margin:0 9px}
.cut-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.cut-len{display:grid;justify-items:end}
.cut-len b{font-family:var(--f-rank);font-weight:400;font-size:30px;line-height:1;color:var(--hot);font-variant-numeric:tabular-nums}
.cut-len b.max{color:var(--danger)}
.cut-len span{font-size:11px;color:var(--mute)}
.cut-sum{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.cut-sum b{font-family:var(--f-mono);font-weight:500;color:var(--fg)}
@media (max-width:520px){.cut-row{grid-template-columns:1fr 1fr}.cut-len{grid-column:1/-1;justify-items:start}}
.meter{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:0}
.copyrow{display:flex;gap:6px;align-items:flex-start}
.copyrow textarea,.copyrow input{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:60;font-size:13px}
.empty{color:var(--mute);font-size:13px;padding:8px 0}
.hint{font-size:12px;color:var(--faint)}
.code{font-family:var(--f-mono);font-size:11px;line-height:1.5;min-height:150px;white-space:pre;overflow:auto;color:var(--fg)}
.code.short{min-height:74px}
.links{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.link-row{display:grid;gap:6px;padding:10px;border-bottom:1px solid var(--line);background:var(--panel)}
.link-row:last-child{border-bottom:0}
.link-row.sel{background:var(--raise)}
.link-h{display:flex;gap:6px;align-items:center;font-size:12px;min-width:0}
.link-h b{font-family:var(--f-rank);font-weight:400;font-size:15px;color:var(--hot);letter-spacing:.02em}
.link-h .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.link-row input{padding:7px 9px;font-size:12px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.plat{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--raise);color:var(--mute);white-space:nowrap}
.plat[data-p="youtube"]{background:rgba(255,48,48,.18);color:#ff7a7a}
.plat[data-p="tiktok"]{background:rgba(37,244,238,.14);color:#6ff3ef}
.plat[data-p="instagram"]{background:rgba(225,48,108,.18);color:#ff7fb0}
.plat[data-p="facebook"]{background:rgba(24,119,242,.2);color:#8ab8ff}
.plat[data-p="bad"]{background:rgba(255,93,93,.16);color:var(--danger)}
.got{font-size:10px;font-weight:700;color:var(--ok);white-space:nowrap}
.bad-input{border-color:var(--danger)!important}
details{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
details summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--mute)}
details[open] summary{margin-bottom:8px}
details > .sect{gap:8px}
.steps{margin:0;padding-left:18px;display:grid;gap:4px;font-size:12px;color:var(--mute)}
.card-open{all:unset;display:flex;flex-direction:column;cursor:pointer;border-radius:12px 12px 0 0}
.card-open:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.card-acts{display:flex;gap:6px;padding:0 10px 12px;justify-content:flex-end}
.settings{max-width:760px}
.set-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:12px}
.set-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--raise);color:var(--mute);white-space:nowrap}
.pill.ok{background:rgba(62,207,142,.16);color:var(--ok)}
.pill.bad{background:rgba(255,93,93,.14);color:var(--danger)}
.fetchrow{flex-wrap:nowrap;min-width:0}
.jobwrap{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.job{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.job.ok{color:var(--ok)}
.job.err{color:var(--danger);white-space:normal}
.jbar{flex:1;height:4px;background:var(--bg);border-radius:3px;overflow:hidden;min-width:30px}
.jbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.savest{font-size:12px;color:var(--faint);min-width:52px}

<script>
(() => {
"use strict";
// ---------- local server API ----------
const API = {
  async req(method, path, body, isForm) {
    const opts = { method, headers: { "X-Clipdeck": "1" } };
    if (body !== undefined) {
      if (isForm) opts.body = body;
      else { opts.body = JSON.stringify(body); opts.headers["Content-Type"] = "application/json"; }
    }
    let r;
    try { r = await fetch(path, opts); } catch (e) { throw { code: 0, message: "Can't reach the Clipdeck server. Is it still running?" }; }
    let data = null; try { data = await r.json(); } catch (e) {}
    if (!r.ok) throw { code: r.status, message: (data && data.detail) || `Request failed (${r.status})` };
    return data;
  },
  get(p) { return this.req("GET", p); },
  post(p, b) { return this.req("POST", p, b ?? {}); },
  put(p, b) { return this.req("PUT", p, b); },
  del(p) { return this.req("DELETE", p); },
  form(p, f) { return this.req("POST", p, f, true); }
};

// ---------- model: a ranking = optional hook, N items, optional outro. Ranks come from position + order. ----------
const W = 720, H = 1280;
const BGS = ["#1d3fbf", "#c2185b", "#0f8a6a", "#e65100", "#5e35b1", "#263238", "#b71c1c", "#00838f"];
const uid = () => Math.random().toString(36).slice(2, 10);
const S = { status: {}, jobs: {}, src: {}, projects: [], media: {}, cur: null, view: "dash", t: 0, playing: false, exporting: false, sel: 0, tab: "media", guides: false };
const els = {};
const MAX_CLIP = 20; // seconds per clip
const mk = (kind, text, dur, bg, label = "") => ({ id: uid(), kind, mediaId: null, trim: 0, dur, text, label, bg, zoom: 1, panX: 0, panY: 0, motion: true, src: { url: "", from: "", to: "" } });

// ---------- source links → yt-dlp command ----------
// "12", "0:12", "1:02.5" → seconds; blank → null; anything else → NaN
function parseT(v) {
  v = String(v || "").trim(); if (!v) return null;
  if (!/^\d+(:\d{1,2})?(\.\d+)?$|^\d+:\d{2}:\d{2}(\.\d+)?$/.test(v)) return NaN;
  return v.split(":").reduce((a, x) => a * 60 + parseFloat(x), 0);
}
function cleanUrl(u) { u = String(u || "").trim(); if (!/^https?:\/\/[^\s]+$/i.test(u)) return ""; return u.replace(/["$`\\!]/g, ""); }
function platformOf(u) {
  u = String(u || "").trim(); if (!u) return null;
  if (!cleanUrl(u)) return { k: "bad", n: "Not a link" };
  const h = (u.match(/^https?:\/\/([^/?#]+)/i) || [])[1]?.toLowerCase() || "";
  if (/(^|\.)youtube\.com$|(^|\.)youtu\.be$/.test(h)) return { k: "youtube", n: /\/shorts\//.test(u) ? "YT Short" : "YouTube" };
  if (/(^|\.)tiktok\.com$/.test(h)) return { k: "tiktok", n: "TikTok" };
  if (/(^|\.)instagram\.com$/.test(h)) return { k: "instagram", n: "Instagram" };
  if (/(^|\.)facebook\.com$|(^|\.)fb\.watch$/.test(h)) return { k: "facebook", n: "Facebook" };
  return { k: "other", n: h.replace(/^www\./, "") };
}
const slugify = (s, n = 30) => String(s || "").toLowerCase().normalize("NFKD").replace(/[^\w\s-]/g, "").trim().replace(/[\s_]+/g, "-").replace(/-+/g, "-").slice(0, n).replace(/-$/, "");
function fileTag(p, s) { return s.kind === "item" ? `r${rankOf(p, s)}${s.label ? "-" + slugify(s.label, 24) : ""}` : s.kind; }
function buildCmd(p, browser) {
  const folder = slugify(p.name, 40) || "ranking", out = [];
  p.scenes.forEach((s, i) => {
    const u = cleanUrl(s.src && s.src.url); if (!u) return;
    const a = parseT(s.src.from), b = parseT(s.src.to);
    // Always cut: from the start time (or 0) to the end time, never longer than MAX_CLIP.
    const a0 = a != null && !isNaN(a) ? a : 0;
    const b0 = Math.min(b != null && !isNaN(b) && b > a0 ? b : a0 + MAX_CLIP, a0 + MAX_CLIP);
    const sec = ` --download-sections "*${+a0.toFixed(2)}-${+b0.toFixed(2)}" --force-keyframes-at-cuts`;
    const name = `${String(i + 1).padStart(2, "0")}-${fileTag(p, s)}_cd-${s.id}`;
    out.push(`yt-dlp -f "bv*[height<=1080]+ba/b[height<=1080]/b" --merge-output-format mp4${browser ? " --cookies-from-browser " + browser : ""}${sec} -o "${name}.%(ext)s" "${u}"`);
  });
  if (!out.length) return "";
  return [`mkdir -p ~/Videos/clipdeck/${folder} && cd ~/Videos/clipdeck/${folder}`, ...out, `xdg-open .`].join("\n");
}

function exampleProject() {
  return normalize({
    id: uid(), example: true, name: "Top 5 Goalkeeper Blunders", headline: "TOP 5 KEEPER BLUNDERS", order: "down", layout: "ladder",
    updated: Date.now(), captionStyle: "punch", flash: true, music: null,
    scenes: [
      mk("hook", "Number one should end his career", 2.5, BGS[5]),
      mk("item", "Slips on the wet grass and the ball rolls past", 4, BGS[0], "The Slip"),
      mk("item", "Throws it straight into his own net", 4, BGS[1], "Own-Goal Throw"),
      mk("item", "Celebrates before the ball stops rolling", 4, BGS[2], "Early Celebration"),
      mk("item", "Tries to dribble the striker and loses it", 4, BGS[3], "Failed Dribble"),
      mk("item", "Punches his own defender into the goal", 4.5, BGS[6], "The Punch"),
      mk("outro", "Which one hurt the most? Comment below", 3, BGS[4])
    ],
    meta: { title: "Top 5 Goalkeeper Blunders, Ranked 😳", description: "Five keeper mistakes ranked from bad to unforgivable. Which one is the worst?", hashtags: "shorts, football, soccer, goalkeeper, ranking" }
  });
}
// Fill defaults and upgrade projects saved by the earlier general-purpose version.
function normalize(p) {
  p.headline = p.headline ?? (p.name || "").toUpperCase();
  p.order = p.order || "down"; p.layout = p.layout || "ladder";
  if (p.keepTop == null) p.keepTop = true;
  if (!p.ladderBg) p.ladderBg = "clear";
  // Default layout: a solid top section with the headline, the clip in the middle, and a matching bottom section.
  if (!p.bandsV1) { p.videoArea = "bands"; p.bandsV1 = true; }
  // The clip fills the whole middle between the two sections.
  if (!p.fillV1) { if (p.videoArea === "bands") p.videoFit = "fill"; p.fillV1 = true; }
  if (!p.videoArea) p.videoArea = "bands";
  if (!p.bandColor) p.bandColor = "#000000";
  if (p.bandExtra == null) p.bandExtra = 0;
  if (p.bandH === undefined) p.bandH = null; // null = auto
  if (p.rankPos == null) p.rankPos = 0;
  if (!p.videoFit) p.videoFit = "fit";
  if (p.videoNudge == null) p.videoNudge = 0;
  p.meta = p.meta || { title: "", description: "", hashtags: "" };
  p.hl = Object.assign({ font: "Anton", size: 58, color: "#ffffff", bg: "#000000", caps: true, words: [] }, p.hl || {});
  const n = p.scenes.length;
  p.scenes.forEach((s, i) => {
    if (!s.kind) s.kind = s.rank ? "item" : i === 0 ? "hook" : i === n - 1 ? "outro" : "item";
    if (s.label == null) s.label = "";
    if (s.panY == null) s.panY = 0;
    if (!s.src) s.src = { url: "", from: "", to: "" };
    if (s.dur > MAX_CLIP) s.dur = MAX_CLIP;
    if (typeof s.rank !== "number") delete s.rank; // old versions stored "#5" strings
  });
  const g = { hook: 0, item: 1, outro: 2 };
  p.scenes = p.scenes.map((s, i) => [s, i]).sort((a, b) => g[a[0].kind] - g[b[0].kind] || a[1] - b[1]).map(x => x[0]);
  p.scenes.filter(s => s.kind === "hook").slice(1).forEach(s => s.kind = "item");
  p.scenes.filter(s => s.kind === "outro").slice(0, -1).forEach(s => s.kind = "item");
  return p;
}
const items = p => p.scenes.filter(s => s.kind === "item");
const MAX_RANKS = 6;
const full = p => items(p).length >= MAX_RANKS;
// Countdown and start-at-#1 derive ranks from play position. Shuffle keeps each item's own rank.
function rankOf(p, s) {
  const it = items(p), i = it.indexOf(s); if (i < 0) return 0;
  if (p.order === "shuffle") return s.rank || i + 1;
  return p.order === "down" ? it.length - i : i + 1;
}
// Keep shuffle ranks a clean 1..N after items are added, copied or deleted.
function fixRanks(p) {
  if (p.order !== "shuffle") return;
  [...items(p)].sort((a, b) => (a.rank || 1e9) - (b.rank || 1e9)).forEach((s, i) => s.rank = i + 1);
}
// Random play order. With keepTop, #1 always plays last. Avoids landing on a plain countdown.
function shuffledItems(p) {
  const it = items(p), N = it.length; let best = it;
  for (let tries = 0; tries < 12; tries++) {
    const a = [...it];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    if (p.keepTop) { const top = a.findIndex(s => s.rank === 1); if (top >= 0) a.push(a.splice(top, 1)[0]); }
    best = a;
    const ranks = (p.keepTop ? a.slice(0, -1) : a).map(s => s.rank), down = ranks.every((r, i) => i === 0 || r < ranks[i - 1]), up = ranks.every((r, i) => i === 0 || r > ranks[i - 1]);
    const same = a.every((s, i) => s === it[i]);
    if (N < 3 || (!down && !up && !same)) break;
  }
  return best;
}
function setPlayOrder(p, list) {
  const hook = p.scenes.filter(s => s.kind === "hook"), out = p.scenes.filter(s => s.kind === "outro");
  p.scenes = [...hook, ...list, ...out];
}
const totalDur = p => (p || S.cur).scenes.reduce((a, s) => a + s.dur, 0);
function sceneAtIn(p, t) {
  const sc = p.scenes; let start = 0;
  for (let i = 0; i < sc.length; i++) { if (t < start + sc[i].dur || i === sc.length - 1) return { s: sc[i], i, start }; start += sc[i].dur; }
  return null;
}
const sceneAt = t => sceneAtIn(S.cur, t);
const sceneStart = i => S.cur.scenes.slice(0, i).reduce((a, s) => a + s.dur, 0);
const fmt = t => { t = Math.max(0, t); const m = Math.floor(t / 60), s = t % 60; return `${m}:${s.toFixed(1).padStart(4, "0")}`; };
const saveTimers = {};
function setSaved(v) { const el = document.getElementById("save-st"); if (el) el.textContent = v === null ? "Saving…" : v ? "Saved" : "Not saved"; }
function saveProject(p, now) {
  clearTimeout(saveTimers[p.id]);
  const go = () => { delete saveTimers[p.id]; return API.put(`/api/projects/${p.id}`, p).then(() => setSaved(true)).catch(e => { setSaved(false); toast("Couldn't save: " + e.message); }); };
  if (now) return go();
  saveTimers[p.id] = setTimeout(go, 500);
}
function touch(p = S.cur) { if (!p) return; fixRanks(p); p.updated = Date.now(); setSaved(null); saveProject(p); }
window.addEventListener("pagehide", () => {
  for (const id of Object.keys(saveTimers)) {
    clearTimeout(saveTimers[id]); const p = S.projects.find(x => x.id === id);
    if (p) fetch(`/api/projects/${id}`, { method: "PUT", keepalive: true, headers: { "X-Clipdeck": "1", "Content-Type": "application/json" }, body: JSON.stringify(p) });
  }
});

// ---------- media ----------
function mediaEl(id) {
  if (!id || !S.media[id]) return null;
  if (els[id]) return els[id];
  const m = S.media[id], url = `/media/${id}`;
  let el;
  if (m.type === "image") { el = new Image(); el.src = url; el.onload = () => drawNow(); }
  else { el = document.createElement(m.type === "video" ? "video" : "audio"); el.src = url; el.preload = "auto"; el.playsInline = true; if (m.type === "video") el.addEventListener("loadeddata", () => drawNow()); }
  els[id] = { el, url, type: m.type };
  if (AU.ctx && m.type !== "image") AU.route(els[id]);
  return els[id];
}
async function addFiles(files, assign) {
  const p = S.cur, added = [];
  const ok = files.filter(f => /^(video|image|audio)\//.test(f.type) || /\.(mp4|mov|webm|mkv|m4v|jpe?g|png|webp|gif|mp3|m4a|wav|ogg|aac|flac)$/i.test(f.name));
  if (!ok.length) return toast("Those files aren't video, image or audio.");
  for (let i = 0; i < ok.length; i++) {
    toast(ok.length > 1 ? `Adding ${i + 1} of ${ok.length}…` : `Adding ${ok[i].name}…`);
    const fd = new FormData(); fd.append("projectId", p.id); fd.append("file", ok[i], ok[i].name);
    try { const m = await API.form("/api/media", fd); S.media[m.id] = m; added.push(m); }
    catch (e) { toast(`Couldn't add ${ok[i].name}: ${e.message}`); }
  }
  if (!added.length) return;
  if (assign && S.cur === p) {
    const visual = added.filter(m => m.type !== "audio"), s = p.scenes[S.sel];
    if (s && visual[0]) { s.mediaId = visual[0].id; s.trim = 0; onVideoSet(S.sel); }
    const aud = added.find(m => m.type === "audio");
    if (aud && !p.music) p.music = { mediaId: aud.id, vol: 0.6 };
  }
  touch(p); toast(`Added ${added.length} file${added.length > 1 ? "s" : ""}`);
  if (S.cur === p && S.view === "edit") render();
}
// Fill empty ranks in play order, so the first clip lands on the first rank shown.
function autofill() {
  const vis = projMedia().filter(m => m.type !== "audio"); if (!vis.length) return;
  let k = 0, n = 0;
  for (const s of S.cur.scenes) if (!s.mediaId && s.kind === "item") { s.mediaId = vis[k % vis.length].id; s.trim = 0; k++; n++; }
  touch(); toast(n ? `Filled ${n} rank${n > 1 ? "s" : ""} in play order` : "Every rank already has a clip"); render();
}
const projMedia = () => Object.values(S.media).filter(m => m.projectId === S.cur.id);

// ---------- audio graph ----------
const AU = {
  ctx: null, master: null, rec: null, srcs: new WeakSet(),
  init() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      this.rec = this.ctx.createMediaStreamDestination();
      Object.values(els).forEach(x => x.type !== "image" && this.route(x));
    } catch (e) { this.ctx = null; }
  },
  route(x) {
    if (!this.ctx || this.srcs.has(x.el)) return;
    try { const src = this.ctx.createMediaElementSource(x.el); x.gain = this.ctx.createGain(); src.connect(x.gain); x.gain.connect(this.master); this.srcs.add(x.el); } catch (e) {}
  }
};

// ---------- drawing ----------
const canvas = document.createElement("canvas"); canvas.width = W; canvas.height = H; canvas.setAttribute("aria-label", "Video preview");
const ctx = canvas.getContext("2d");
// Top and bottom sections: the same height and colour. The top one holds the headline,
// starting below the Shorts search bar; the clip fills the space between them.
const BAND_TOP_PAD = 100, BAND_BOTTOM_PAD = 34, BAND_MIN = 200, BAND_MAX = 460, BAND_SET_MIN = 40, BAND_SET_MAX = 520;
// Auto height: just enough for the headline below the Shorts search bar.
function bandAutoHeight(c, p) {
  c.save(); const bottom = drawHeadline(c, p, true, { top: BAND_TOP_PAD, plain: true }); c.restore();
  const auto = hlWordList(p).length ? bottom + BAND_BOTTOM_PAD : BAND_MIN;
  return Math.round(Math.min(BAND_MAX, Math.max(BAND_MIN, auto)));

  render();
}
function render() { if (S.view === "dash") renderDash(); else if (S.view === "settings") renderSettings(); else renderEditor(); }

      <div class="compose-row">

        <button class="btn primary" id="ai-go">${I.spark}Generate ranking</button>

        <div class="chips" id="chips"></div>

      <div class="sect-h"><h2>Your rankings</h2><div class="stats"><div class="stat"><b>${ps.length}</b><span>rankings</span></div><div class="stat"><b>${ranked}</b><span>ranked items</span></div><div class="stat"><b>${fmt(secs)}</b><span>total runtime</span></div></div></div>
      ${ps.length ? `<div class="grid">${ps.map(p => `<div class="card"><button class="card-open" data-open="${p.id}"><div class="thumb"><canvas width="${W}" height="${H}" data-thumb="${p.id}"></canvas>${p.example ? '<span class="tag">Example</span>' : ""}</div>
        <div class="card-body"><h3>${esc(p.name)}</h3><div class="card-meta">Top ${items(p).length} · ${fmt(totalDur(p))} · ${new Date(p.updated).toLocaleDateString(undefined, { month: "short", day: "numeric" })}</div></div></button>
        <div class="card-acts"><button class="btn sm ghost" data-dup="${p.id}">Duplicate</button><button class="btn sm ghost danger" data-del="${p.id}">Delete</button></div></div>`).join("")}</div>`

  main.querySelectorAll("[data-thumb]").forEach(cv => {

    const i = p.scenes.indexOf(target), at = p.scenes.slice(0, i).reduce((a, s) => a + s.dur, 0) + target.dur * 0.7;

  main.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openProject(b.dataset.open));

      chips.innerHTML = (d.ideas || []).map(x => `<button class="chip" data-topic="${esc(x.topic)}" data-n="${Math.min(MAX_RANKS, +x.n || 5)}"><b>TOP ${Math.min(MAX_RANKS, +x.n || 5)}</b>${esc(x.topic)}</button>`).join("") || `<span class="status">No ideas came back. Try a different niche.</span>`;
      chips.querySelectorAll("[data-topic]").forEach(c => c.onclick = () => { document.getElementById("ai-topic").value = c.dataset.topic; const sel = document.getElementById("ai-n"); if ([...sel.options].some(o => o.value === c.dataset.n)) sel.value = c.dataset.n; document.getElementById("ai-topic").focus(); });

    btn.disabled = false;
  };
  document.getElementById("ai-go").onclick = async ev => {
    const btn = ev.currentTarget, st = document.getElementById("ai-st");
    const topic = document.getElementById("ai-topic").value.trim(); if (!topic) { st.textContent = "Type what you're ranking first."; st.className = "status err"; return; }

    btn.disabled = true; st.className = "status"; let secs = 0; st.textContent = "Claude is writing your ranking…";
    const iv = setInterval(() => { secs++; st.textContent = `Claude is writing your ranking… ${secs}s`; }, 1000);
    try {
      const d = await aiRanking(topic, n);
      const dur = (x, lo, hi, def) => Math.max(lo, Math.min(hi, +x || def));
      const its = d.items.slice(0, n).map((x, i) => mk("item", String(x.text || ""), dur(x.dur, 2, 8, 4), BGS[i % BGS.length], String(x.label || "")));
      its.forEach((s, i) => s.rank = its.length - i); // Claude lists them from #N down to #1
      if (order === "up") its.reverse();
      const p = { id: uid(), name: d.name || topic, headline: String(d.headline || "").toUpperCase(), order, layout: "ladder", updated: Date.now(), captionStyle: "punch", flash: true, music: null,
        scenes: [...(d.hook && d.hook.text ? [mk("hook", String(d.hook.text), dur(d.hook.dur, 1.5, 4, 2.5), BGS[5])] : []), ...its, ...(d.outro && d.outro.text ? [mk("outro", String(d.outro.text), dur(d.outro.dur, 1.5, 4, 2.5), BGS[4])] : [])],
        meta: { title: d.title || "", description: d.description || "", hashtags: (d.hashtags || []).join(", ") }, keepTop: true };
      normalize(p);
      if (order === "shuffle") setPlayOrder(p, shuffledItems(p));
      await saveProject(p, true); S.projects.push(p); await openProject(p.id); toast("Ranking ready. Paste a link or add a clip for each rank.");
    } catch (e) { st.className = "status err"; st.textContent = aiError(e); btn.disabled = false; }
    clearInterval(iv);
  };
}
function blank() {
  return { id: uid(), name: "Untitled ranking", headline: "TOP 5", order: "down", layout: "ladder", updated: Date.now(), captionStyle: "punch", flash: true, music: null,
    scenes: [mk("hook", "Wait for number one", 2.5, BGS[5]), ...[0, 1, 2, 3, 4].map(i => mk("item", "", 4, BGS[i])), mk("outro", "Agree with the list? Comment below", 2.5, BGS[4])],
    meta: { title: "", description: "", hashtags: "" } };
}
async function newProject() { const p = normalize(blank()); await saveProject(p, true); S.projects.push(p); await openProject(p.id); S.sel = 1; S.t = sceneStart(1) + 0.01; renderInspector(); markSel(); still(); }
async function openProject(id) {
  const p = S.projects.find(x => x.id === id); if (!p) return;
  try { (await API.get(`/api/media?project=${encodeURIComponent(id)}`)).forEach(m => S.media[m.id] = m); } catch (e) { toast(e.message); }
  normalize(p); // fills in settings added in newer versions (headline style, rank list, shuffle)
  S.cur = p; S.t = 0; S.sel = 0; setView("edit");
}
async function duplicateProject(id) {
  const src = S.projects.find(p => p.id === id); if (!src) return;
  const p = JSON.parse(JSON.stringify(src));
  p.id = uid(); p.name = src.name + " (copy)"; p.updated = Date.now(); delete p.example; p.scenes.forEach(s => s.id = uid());
  try {
    const map = await API.post(`/api/projects/${p.id}/copy-media`, { from: src.id });
    Object.values(map).forEach(m => S.media[m.id] = m);
    p.scenes.forEach(s => { if (s.mediaId) s.mediaId = (map[s.mediaId] || {}).id || null; });
    if (p.music) { p.music.mediaId = (map[p.music.mediaId] || {}).id; if (!p.music.mediaId) p.music = null; }
    await saveProject(p, true); S.projects.push(p); renderDash(); toast("Duplicated");
  } catch (e) { toast(e.message); }
}

function bindRgb(root, onChange) {

// ----- add any Google Font by name
const titleCase = s => s.toLowerCase().replace(/\b[a-z]/g, ch => ch.toUpperCase());
function probeCss(url) {
  return new Promise(res => {
    const l = document.createElement("link"); let done = false;
    const end = ok => { if (done) return; done = true; if (!ok) l.remove(); res(ok); };
    l.rel = "stylesheet"; l.href = url; l.onload = () => end(true); l.onerror = () => end(false);
    document.head.appendChild(l); setTimeout(() => end(false), 10000);
  });
}
async function addGoogleFont(input) {
  const typed = input.trim().replace(/\s+/g, " ");
  if (!/^[A-Za-z0-9][A-Za-z0-9 ]{0,49}$/.test(typed)) throw new Error("Type a font name using letters, numbers and spaces.");
  for (const name of [...new Set([typed, titleCase(typed)])]) {
    const known = Object.keys(FONT_LIB).concat(Object.keys(S.customFonts)).find(n => n.toLowerCase() === name.toLowerCase());
    if (known) return known;
    const weights = [];
    for (const w of [400, 700, 900]) if (await probeCss(fontCssUrl(name, w === 400 ? null : [w]))) weights.push(w);
    if (weights.length) {
      S.customFonts[name] = { fb: "sans-serif", weights, def: weights.includes(700) ? 700 : weights[weights.length - 1] };
      cssLoaded.add(name); loadFont(name);
      const list = Object.entries(S.customFonts).filter(([, f]) => !f.local).map(([n, f]) => ({ name: n, weights: f.weights }));
      try { S.status = await API.post("/api/settings", { fonts: list }); } catch (e) { toast("Font added for now, but couldn't be saved: " + e.message); }
      return name;
    }
  }
  throw new Error(`Google Fonts has no font called "${typed}". Check the exact name on fonts.google.com.`);
}

  q("#w-done").onclick = () => { S.hlSel.clear(); renderHlWords(); };
}
function pinnedComment() {
  const p = S.cur, it = items(p); if (!it.length) return "";
  const byRank = [...it].sort((a, b) => rankOf(p, a) - rankOf(p, b));
  return `${(p.headline || p.name).replace(/\s*\n\s*/g, " ")}\n` + byRank.map(s => `#${rankOf(p, s)} ${s.label || s.text}`).join("\n") + `\n\nWhat would you put at #1?`;
}

function renderInspector() {
  const R = document.getElementById("right"); if (!R) return; const p = S.cur, s = p.scenes[S.sel];
  if (!s) { R.innerHTML = `<p class="empty">Nothing here yet. Add a rank from the timeline.</p>`; return; }
  const m = s.mediaId && S.media[s.mediaId], visual = projMedia().filter(x => x.type !== "audio");
  const r = rankOf(p, s), N = items(p).length;
  const head = s.kind === "item" ? `<span class="rankpill">#${r}</span><span class="card-meta">of ${N} · set by position</span>` : `<span class="kindpill">${s.kind}</span><span class="card-meta">${s.kind === "hook" ? "Plays first, before any rank" : "Plays after the last rank"}</span>`;
  R.innerHTML = `<div class="sect-h"><div class="row">${head}</div></div>
    ${s.kind === "item" ? `<div class="field"><label for="s-label">Name on the rank list</label><input type="text" id="s-label" value="${esc(s.label)}" placeholder="e.g. The Punch" maxlength="40"></div>` : ""}
    <div class="field"><label for="s-text">Caption</label><textarea id="s-text" placeholder="${s.kind === "item" ? "What happens in this clip" : s.kind === "hook" ? "Tease #1 so viewers stay" : "Ask viewers to comment"}">${esc(s.text)}</textarea></div>
    <div class="field"><label for="s-dur">Length (seconds, ${MAX_CLIP} max)</label><input type="number" id="s-dur" min="0.5" max="${MAX_CLIP}" step="0.5" value="${s.dur}"></div>
    <div class="sect"><span class="lbl">Clip</span>
      <select id="s-media" aria-label="Clip"><option value="">No clip (color background)</option>${visual.map(x => `<option value="${x.id}" ${x.id === s.mediaId ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>
      <button class="btn sm" id="s-up">${I.up}Upload a clip for this ${s.kind === "item" ? "rank" : s.kind}</button>
      <div class="field"><label for="s-url">Source link</label><input type="text" inputmode="url" id="s-url" value="${esc(s.src.url)}" placeholder="TikTok, YouTube, Instagram or Facebook link"></div>
      ${cleanUrl(s.src.url) ? `<div class="row fetchrow"><button class="btn sm ${m ? "ghost" : ""}" id="s-fetch" data-fetch-id="${s.id}" ${ACTIVE.includes((S.jobs[s.id] || {}).state) ? "disabled" : ""}>${m ? "Fetch again from link" : "Fetch clip from link"}</button><span class="jobwrap" id="job-${s.id}">${jobLine(s.id)}</span></div>` : ""}
      ${m && m.type === "video" ? `<div class="cut-sum"><span>Using</span><b>${fmt(s.trim)} → ${fmt(s.trim + s.dur)}</b><span>of a ${fmt(m.duration)} clip</span></div>
        <button class="btn sm primary" id="s-cut">Cut clip</button>` : ""}
      ${cleanUrl(s.src.url) && S.tab !== "links" ? `<button class="btn sm" id="s-full" data-full-id="${s.id}">${I.play}${fullBtnLabel(cleanUrl(s.src.url))}</button>` : ""}
      ${m ? `<div class="field"><label for="s-zoom">Zoom</label><input type="range" id="s-zoom" min="1" max="2.5" step="0.05" value="${s.zoom}"></div>
        <div class="field"><label for="s-pan">Frame left ↔ right</label><input type="range" id="s-pan" min="-1" max="1" step="0.05" value="${s.panX}"></div>
        <div class="field"><label for="s-pany">Frame up ↕ down</label><input type="range" id="s-pany" min="-1" max="1" step="0.05" value="${s.panY || 0}"></div>
        <label class="row"><input type="checkbox" id="s-mot" ${s.motion ? "checked" : ""}> Slow push-in</label>` : ""}
    </div>
    ${!m ? `<div class="sect"><span class="lbl">Background</span><div class="swatches">${BGS.map(c => `<button class="sw" style="background:${c}" aria-label="Color ${c}" aria-pressed="${c === s.bg}" data-bg="${c}"></button>`).join("")}</div></div>` : ""}
    <div class="row">${s.kind === "item" ? `<button class="btn sm" id="s-hi" ${r === 1 ? "disabled" : ""}>Rank higher</button><button class="btn sm" id="s-lo" ${r === N ? "disabled" : ""}>Rank lower</button><button class="btn sm" id="s-dup" ${full(p) ? "disabled" : ""}>Duplicate</button>` : ""}<button class="btn sm danger" id="s-del">Delete</button></div>`;
  const q = id => R.querySelector(id);
  const upd = (fn, tl = true) => { fn(); touch(); if (tl) renderTimeline(); still(); };
  const lb = q("#s-label"); if (lb) lb.oninput = e => upd(() => s.label = e.target.value);
  q("#s-text").oninput = e => upd(() => s.text = e.target.value);
  q("#s-dur").onchange = e => { upd(() => s.dur = Math.max(0.5, Math.min(MAX_CLIP, +e.target.value || 3))); if (+e.target.value > MAX_CLIP) { e.target.value = MAX_CLIP; toast(`Clips are ${MAX_CLIP} seconds at most.`); } updateClock(); };
  q("#s-media").onchange = e => { upd(() => { s.mediaId = e.target.value || null; s.trim = 0; onVideoSet(S.sel); }); renderInspector(); };
  const ct = q("#s-cut"); if (ct) ct.onclick = () => openCutter(S.sel);
  const fu = q("#s-full"); if (fu) fu.onclick = () => openFullCutter(s.id);
  renderSrcView();
  q("#s-up").onclick = () => pickFiles(true);
  const tr = q("#s-trim"); if (tr) tr.oninput = e => { s.trim = +e.target.value; q("#trim-l").textContent = `Start at ${s.trim.toFixed(1)} s of ${m.duration.toFixed(1)} s`; S.t = sceneStart(S.sel); upd(() => {}, false); };
  const fit = q("#s-fit"); if (fit) fit.onclick = () => { upd(() => s.dur = Math.max(0.5, Math.min(MAX_CLIP, Math.round((m.duration - s.trim) * 10) / 10))); renderInspector(); };
  const z = q("#s-zoom"); if (z) z.oninput = e => upd(() => s.zoom = +e.target.value, false);
  const pn = q("#s-pan"); if (pn) pn.oninput = e => upd(() => s.panX = +e.target.value, false);
  const py = q("#s-pany"); if (py) py.oninput = e => upd(() => s.panY = +e.target.value, false);
  const mo = q("#s-mot"); if (mo) mo.onchange = e => upd(() => s.motion = e.target.checked, false);
  R.querySelectorAll("[data-bg]").forEach(b => b.onclick = () => { upd(() => s.bg = b.dataset.bg); renderInspector(); });
  const swapRank = target => {
    const other = items(p).find(x => rankOf(p, x) === target); if (!other) return;
    if (p.order === "shuffle") { other.rank = s.rank; s.rank = target; touch(); renderInspector(); renderTimeline(); still(); if (S.tab === "style") renderLeft(); return; }
    moveScene(S.sel, p.scenes.indexOf(other));
  };
  const hi = q("#s-hi"); if (hi) hi.onclick = () => swapRank(r - 1);
  const lo = q("#s-lo"); if (lo) lo.onclick = () => swapRank(r + 1);
  const su = q("#s-url"); if (su) su.oninput = e => { s.src.url = e.target.value; const pl = platformOf(e.target.value); su.classList.toggle("bad-input", !!pl && pl.k === "bad"); touch(); renderTimeline(); };
  if (su) su.onchange = () => renderInspector();
  const sf = q("#s-fetch"); if (sf) sf.onclick = () => fetchScene(s);
  const dp = q("#s-dup"); if (dp) dp.onclick = () => { if (full(p)) return; p.scenes.splice(S.sel + 1, 0, { ...s, id: uid(), src: { ...s.src }, rank: items(p).length + 1 }); S.sel++; touch(); renderInspector(); renderTimeline(); still(); };
  const del = q("#s-del");
  del.onclick = () => {
    if (del.dataset.armed) { p.scenes.splice(S.sel, 1); S.sel = Math.max(0, Math.min(S.sel, p.scenes.length - 1)); S.t = Math.min(S.t, totalDur()); touch(); renderLeft(); renderInspector(); renderTimeline(); still(); }
    else { del.dataset.armed = "1"; del.textContent = "Confirm delete"; setTimeout(() => { if (del.isConnected) { delete del.dataset.armed; del.textContent = "Delete"; } }, 3000); }
  };
}
function moveScene(from, to) {
  const sc = S.cur.scenes; if (to < 0 || to >= sc.length || from === to) return;
  if (sc[from].kind !== "item" || sc[to].kind !== "item") return; // hook and outro stay put
  const [x] = sc.splice(from, 1); sc.splice(to, 0, x); S.sel = to; S.t = sceneStart(to) + 0.01;
  touch(); renderInspector(); renderTimeline(); still();
}
function addScene(kind, quiet) {
  const p = S.cur, nHook = p.scenes.filter(x => x.kind === "hook").length;
  if (kind === "item") {
    if (full(p)) { if (!quiet) toast(`A ranking holds ${MAX_RANKS} items at most.`); return; }
    const it = items(p), s = mk("item", "", 4, BGS[it.length % BGS.length]);
    s.rank = it.length + 1;
    // A new item becomes the lowest rank: first in a countdown, last when starting at #1,
    // and a random spot in a shuffle (never after #1 when #1 is saved for last).
    let idx;
    if (!it.length) idx = nHook;
    else if (p.order === "shuffle") { const slots = p.keepTop ? it.length : it.length + 1; idx = p.scenes.indexOf(it[0]) + Math.floor(Math.random() * slots); }
    else idx = p.order === "down" ? p.scenes.indexOf(it[0]) : p.scenes.indexOf(it[it.length - 1]) + 1;
    p.scenes.splice(idx, 0, s); S.sel = idx;
  } else if (kind === "hook") { p.scenes.unshift(mk("hook", "Wait for number one", 2.5, BGS[5])); S.sel = 0; }
  else { p.scenes.push(mk("outro", "Agree with the list? Comment below", 2.5, BGS[4])); S.sel = p.scenes.length - 1; }
  if (quiet) return;
  S.t = sceneStart(S.sel) + 0.01; touch(); renderLeft(); renderInspector(); renderTimeline(); still();
  setTimeout(() => (document.getElementById("s-label") || document.getElementById("s-text"))?.focus(), 0);
}

const PX = 34; // px per second
function renderTimeline() {
  const T = document.getElementById("track"); if (!T) return; const p = S.cur, tot = totalDur();
  const hasHook = p.scenes.some(s => s.kind === "hook"), hasOut = p.scenes.some(s => s.kind === "outro");
  document.getElementById("tl-actions").innerHTML = `<span class="card-meta">${items(p).length} of ${MAX_RANKS} ranks</span><button class="btn sm" id="add-item" ${full(p) ? "disabled" : ""}>${I.plus}Add rank</button>${hasHook ? "" : `<button class="btn sm ghost" id="add-hook">Add hook</button>`}${hasOut ? "" : `<button class="btn sm ghost" id="add-out">Add outro</button>`}<span class="hint">Drag ranks to reorder</span>`;
  document.getElementById("add-item").onclick = () => addScene("item");
  const ah = document.getElementById("add-hook"); if (ah) ah.onclick = () => addScene("hook");
  const ao = document.getElementById("add-out"); if (ao) ao.onclick = () => addScene("outro");
  let ruler = ""; for (let s = 0; s <= Math.ceil(tot); s += tot > 40 ? 5 : 2) ruler += `<span style="left:${s * PX}px">${s}s</span>`;
  T.innerHTML = `<div class="ruler" id="ruler">${ruler}</div>` + p.scenes.map((s, i) => {
    const m = s.mediaId && S.media[s.mediaId];
    const bg = m && m.type === "image" ? `<img class="bgimg" alt="" src="${mediaEl(m.id).url}">` : m && m.type === "video" ? `<video class="bgimg" muted preload="metadata" src="${mediaEl(m.id).url}#t=${s.trim + 0.3}"></video>` : "";
    const top = s.kind === "item" ? `<span class="rk">#${rankOf(p, s)}</span>` : `<span class="kd">${s.kind.toUpperCase()}</span>`;
    return `<button class="clip" ${s.kind === "item" ? 'draggable="true"' : ""} data-i="${i}" aria-selected="${i === S.sel}" style="width:${Math.max(48, s.dur * PX - 4)}px;background:${s.bg}">${bg}${top}<span class="ct">${esc(s.kind === "item" ? s.label || s.text || "Unnamed" : s.text)}</span><span class="cd">${s.src.url && !m ? "link · " : ""}${s.dur.toFixed(1)}s</span></button>`;
  }).join("") + `<div class="playhead" id="ph"></div>`;
  let dragFrom = -1;
  T.querySelectorAll(".clip[data-i]").forEach(c => {
    const i = +c.dataset.i;
    c.onclick = () => { S.sel = i; if (S.playing) pause(); S.t = sceneStart(i) + 0.01; markSel(); renderInspector(); still(); };
    c.ondblclick = () => { const m = S.media[p.scenes[i].mediaId]; if (m && m.type === "video") openCutter(i); };
    c.ondragstart = e => { dragFrom = i; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", String(i)); } catch (x) {} };
    c.ondragend = () => { c.classList.remove("dragging"); T.querySelectorAll(".drop-on").forEach(x => x.classList.remove("drop-on")); };
    c.ondragover = e => { if (dragFrom >= 0 && p.scenes[i].kind === "item") { e.preventDefault(); c.classList.add("drop-on"); } };
    c.ondragleave = () => c.classList.remove("drop-on");
    c.ondrop = e => { e.preventDefault(); if (dragFrom >= 0) moveScene(dragFrom, i); };
  });
  T.querySelector("#ruler").onclick = e => { const r = T.getBoundingClientRect(); seek((e.clientX - r.left) / PX); };
  const ml = document.getElementById("mlane"), mm = p.music && S.media[p.music.mediaId];
  ml.innerHTML = mm ? `${I.note.replace('width="26" height="26"', 'width="16" height="16"')}<span>${esc(mm.name)}</span><div class="music-bar" style="max-width:${tot * PX}px"></div>` : `<span class="hint">No background music. Add an audio file under Clips.</span>`;
  movePlayhead(); updateClock();
}
function markSel() { document.querySelectorAll(".clip[data-i]").forEach(c => c.setAttribute("aria-selected", +c.dataset.i === S.sel)); }
function movePlayhead() {
  const ph = document.getElementById("ph"); if (!ph || !S.cur.scenes.length) return;
  const hit = sceneAt(Math.min(S.t, totalDur() - 0.001));
  ph.style.left = (S.t * PX + hit.i * 4) + "px";
}

// ---------- boot ----------
document.getElementById("nav-dash").onclick = () => setView("dash");
document.getElementById("nav-edit").onclick = () => S.cur && setView("edit");
document.addEventListener("keydown", e => {
  if (S.view !== "edit" || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.querySelector(".modal")) return;
  if (e.code === "Space") { e.preventDefault(); S.playing ? pause() : play(); }
});
document.getElementById("nav-set").onclick = () => setView("settings");
(async () => {
  renderDash();
  try { S.status = await API.get("/api/status"); } catch (e) {}
  try { S.projects = (await API.get("/api/projects")).map(normalize); }
  catch (e) {
    main.innerHTML = `<div class="view"><div class="dash"><header style="display:grid;gap:8px"><div class="eyebrow">Clipdeck</div><h1>Can't reach Clipdeck</h1><p class="lede">${esc(e.message)} Start Clipdeck again from its shortcut, then reload this page.</p></header></div></div>`;
    return;
  }
  if (!S.projects.length) { const ex = exampleProject(); S.projects.push(ex); saveProject(ex, true); }
  if (S.view === "dash") renderDash();
  (S.status.fonts || []).forEach(f => { if (f && f.name && Array.isArray(f.weights) && f.weights.length) S.customFonts[f.name] = { fb: "sans-serif", weights: f.weights, def: f.weights.includes(700) ? 700 : f.weights[f.weights.length - 1] }; });
  try { registerLocalFonts(await API.get("/api/fonts")); } catch (e) {}
  S.projects.forEach(loadProjectFonts);
  document.fonts.load("60px Anton").then(() => setTimeout(() => S.view === "dash" && renderDash(), 300));
  // Came back from an automatic update: reopen what was being edited.
  let back = null; try { back = JSON.parse(sessionStorage.getItem("cd-restore") || "null"); sessionStorage.removeItem("cd-restore"); } catch (e) {}
  if (back) {
    if (back.id && S.projects.some(p => p.id === back.id)) {
      if (back.tab) S.tab = back.tab;
      await openProject(back.id);
      if (back.view === "settings") setView("settings");
      else if (S.cur && back.sel < S.cur.scenes.length) { S.sel = back.sel; S.t = sceneStart(S.sel) + 0.01; renderInspector(); markSel(); still(); }
    } else if (back.view === "settings") setView("settings");
    toast("Clipdeck was updated");
  }
  watchForUpdates();
})();

// ---------- automatic updates ----------
// The server reports a version made from Clipdeck's own files. When it changes, this page saves
// your work and reloads itself (waiting if an export is running). If the server is restarting
// for the update, the page simply waits until it's back.
let seenVersion = null, updateBanner = null;
// The page on disk is newer than the server that's running (it was started before self-updating existed).
let oldBanner = null;
function oldServerBanner() {
  if (oldBanner) return; S.oldServer = true;
  oldBanner = document.createElement("div"); oldBanner.className = "toast"; oldBanner.setAttribute("role", "alert");
  oldBanner.style.cssText = "background:var(--danger);color:#fff;display:flex;gap:10px;align-items:center;max-width:min(560px,92vw)";
  oldBanner.innerHTML = `<span>Clipdeck was updated, but the old copy is still running, so new features won't work yet. Quit it, then open Clipdeck again from your desktop.</span><button class="btn sm" id="old-quit">Quit Clipdeck</button>`;
  document.body.appendChild(oldBanner);
  oldBanner.querySelector("#old-quit").onclick = async () => {
    for (const id of Object.keys(saveTimers)) { const p = S.projects.find(x => x.id === id); if (p) await saveProject(p, true); }
    await API.post("/api/shutdown").catch(() => {});
    oldBanner.innerHTML = "<span>Clipdeck has quit. Open it again from the Clipdeck icon on your desktop.</span>";
  };
}
function watchForUpdates() {
  const check = async () => {
    let r;
    try { r = await API.get("/api/version"); } catch (e) { if (e.code === 404) oldServerBanner(); return; }
    if (r.error) {
      if (!updateBanner) { updateBanner = document.createElement("div"); updateBanner.className = "toast"; updateBanner.style.background = "var(--danger)"; updateBanner.style.color = "#fff"; document.body.appendChild(updateBanner); }
      updateBanner.textContent = r.error; updateBanner.hidden = false;
    } else if (updateBanner) updateBanner.hidden = true;
    if (seenVersion === null) { seenVersion = r.v; return; }
    if (r.v === seenVersion || EXP) return;
    if (S.playing) pause();
    for (const id of Object.keys(saveTimers)) { const p = S.projects.find(x => x.id === id); if (p) await saveProject(p, true); }
    try { sessionStorage.setItem("cd-restore", JSON.stringify({ view: S.view, id: S.cur && S.cur.id, tab: S.tab, sel: S.sel })); } catch (e) {}
    location.reload();
  };
  setInterval(check, 3000); check();
}
})();
</script>
